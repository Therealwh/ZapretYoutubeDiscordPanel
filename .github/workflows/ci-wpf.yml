name: WPF CI

on:
  push:
    branches: [main, feature/daily-anonymous-analytics]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Build panel
        shell: pwsh
        run: dotnet build wpf/YoutubeDiscordPanel.csproj -c Release -v minimal

      - name: Run self tests
        shell: pwsh
        run: |
          $exe = 'wpf/bin/Release/net48/YoutubeDiscordPanel.exe'
          $output = & $exe --selftest
          $output | Out-Host
          $combined = $output -join "`n"
          if ($LASTEXITCODE -ne 0 -or $combined -notmatch 'fail: 0') {
            throw 'Self tests failed'
          }

      - name: Build installer
        shell: pwsh
        run: dotnet build wpf/setup/Setup.csproj -c Release -v minimal
