name: Sync release notes

# Release bodies are taken from .github/release-notes/<tag>.md when the tag is
# published. Releases published before those files existed ended up with an
# auto-generated commit list, which says nothing to someone who just wants to
# know what changed. This job walks the existing releases and puts the written
# notes in place, so the fix does not depend on anybody editing old releases by
# hand.
on:
  push:
    paths:
      - '.github/release-notes/**'
  # The push trigger alone is not enough: when a notes file and its tag land
  # together, this workflow can run BEFORE release-wpf.yml has created the
  # release, and the new release would keep its generated body. Listening to
  # the release itself closes that race.
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      # Only this job edits release bodies; everything else stays read-only.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update release bodies from the notes files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in .github/release-notes/*.md; do
            tag=$(basename "$file" .md)
            if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "skip $tag: no such release"
              continue
            fi
            current=$(gh release view "$tag" --repo "${{ github.repository }}" --json body -q .body)
            wanted=$(cat "$file")
            if [ "$current" = "$wanted" ]; then
              echo "skip $tag: body already up to date"
              continue
            fi
            gh release edit "$tag" --notes-file "$file" --repo "${{ github.repository }}"
            echo "updated $tag"
          done
        env:
          GH_TOKEN: ${{ github.token }}