name: Release (WPF 2.x)

# Version 2 of the panel is a .NET Framework 4.8 WPF app: no Node, no
# electron-builder, no Chromium. The exe is ~250 KB and runs on the .NET
# Framework that already ships with Windows, so there is nothing to download
# and nothing to install besides the program itself.
on:
  push:
    tags: [ 'v2*' ]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # Only the release job may create/upload releases; the rest of the
      # workflow (and any future job) stays read-only.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      # net48 is a Windows-only target and the GitHub runner is Windows, so the
      # reference-assembly package is belt-and-braces, but it keeps the build
      # working if the runner image changes.

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch the current zapret engine for the offline bundle
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          # Interpolation via ${{ }} inside run: would let a crafted tag name
          # break out of the shell string; env: keeps it data.
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # The installer offers a fully offline first run, so the release
          # ships the latest zapret zip next to the setup exe.
          #
          # Retried on purpose: this step depends on a THIRD-PARTY repo and it
          # failed two releases in a row on a plain network blip, taking the
          # whole release down with it. Transient failures are the normal case
          # here, not the exception, so retry before giving up.
          #
          # Supply chain: this zip is embedded into every installer and its
          # winws.exe runs as admin on every user machine. "Whatever upstream
          # published last" is not a trust anchor - the fetched asset must
          # match a SHA-256 recorded in the repo (ENGINE_SHA256S.md, one line
          # per upstream release). Bump that file in a PR when you want a new
          # engine; a changed upstream asset with the same tag then fails the
          # build instead of shipping to users.
          $api = 'https://api.github.com/repos/Flowseal/zapret-discord-youtube/releases/latest'
          $json = $null
          $asset = $null
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $json = Invoke-RestMethod -Uri $api -Headers @{ 'User-Agent' = 'YoutubeDiscordPanel' }
              $asset = $json.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
              if (-not $asset) { throw 'No zapret .zip asset in the latest release' }
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'zapret-bundled.zip'
              if ((Get-Item 'zapret-bundled.zip').Length -lt 100000) { throw 'zapret zip is suspiciously small' }
              break
            } catch {
              Write-Host "attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

          # Verify the fetched zip against the recorded upstream digest.
          $sha = (Get-FileHash 'zapret-bundled.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = (Get-Content 'ENGINE_SHA256S.md' | Where-Object { $_ -match $json.tag_name } | Select-Object -First 1)
          if (-not $expectedLine) {
            throw "ENGINE_SHA256S.md has no entry for upstream $($json.tag_name). Pin the new engine's SHA-256 in a PR first."
          }
          $expected = ($expectedLine -split '\|')[-1].Trim().ToLowerInvariant()
          if ($sha -ne $expected) {
            throw "zapret zip SHA-256 mismatch for $($json.tag_name): got $sha, expected $expected. Upstream asset changed under the same tag - do NOT ship it."
          }
          Write-Host "bundled zapret $($json.tag_name): $($asset.name), SHA-256 verified"

      - name: Run self tests
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet build wpf/YoutubeDiscordPanel.csproj -c Release -v minimal
          $out = & 'wpf/bin/Release/net48/YoutubeDiscordPanel.exe' --selftest
          $out | Out-Host
          if ($out -notmatch 'fail: 0') { throw 'Self tests failed' }

      - name: Build panel and installer
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # The installer embeds the panel exe and the zapret archive, so it has
          # to be built AFTER both exist. This is what makes a single download
          # work instead of "download two files and keep them together".
          New-Item -ItemType Directory -Force -Path 'wpf/setup/Payload' | Out-Null
          Copy-Item 'zapret-bundled.zip' 'wpf/setup/Payload/zapret-bundled.zip' -Force
          dotnet build wpf/setup/Setup.csproj -c Release -v minimal

          $v = "$env:RELEASE_TAG".TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'wpf/bin/Release/net48/YoutubeDiscordPanel.exe' "dist/YoutubeDiscordPanel-$v.exe"
          Copy-Item 'wpf/setup/bin/Release/net48/YoutubeDiscordPanel-Setup.exe' "dist/YoutubeDiscordPanel-Setup-$v.exe"
          # Stable download URLs for the website: a link that never has to be
          # edited when the version changes.
          Copy-Item "dist/YoutubeDiscordPanel-$v.exe"      'dist/YoutubeDiscordPanel-latest.exe'
          Copy-Item "dist/YoutubeDiscordPanel-Setup-$v.exe" 'dist/YoutubeDiscordPanel-Setup-latest.exe'
          Copy-Item 'zapret-bundled.zip' 'dist/zapret-bundled.zip'
          Get-ChildItem dist | Format-Table Name, Length

      - name: Pick release notes
        if: steps.ver.outputs.skip != 'true'
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          file=".github/release-notes/${tag}.md"
          if [ -f "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          # Tag via env, not ${{ }} in run: - a crafted tag name must not reach
          # the shell as code.
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_NOTES: ${{ steps.notes.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES" --repo ${{ github.repository }}
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes --repo ${{ github.repository }}
          fi

      - name: Generate checksums
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # SHA256SUMS.txt ships with the release so users can verify what they
          # downloaded without trusting the download channel alone.
          Get-ChildItem dist | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload assets and publish
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" 'dist/*.exe' 'dist/zapret-bundled.zip' 'dist/SHA256SUMS.txt' --clobber --repo ${{ github.repository }}
          gh release edit "$RELEASE_TAG" --draft=false --repo ${{ github.repository }}