name: Release

on:
  push:
    tags: [ 'v*' ]
    # A version bump merged into main releases automatically: the tag is
    # created by the "Create draft release" step (skipped if it already exists).
    branches: [ main ]
    paths: [ package.json ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version tag
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && gh release view "v$v" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v$v already exists, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        if: steps.ver.outputs.skip != 'true'
        run: npm test

      - name: Create draft release with notes
        if: steps.ver.outputs.skip != 'true'
        run: gh release create "${{ steps.ver.outputs.tag }}" --target "${{ github.sha }}" --draft --title "${{ steps.ver.outputs.tag }}" --generate-notes --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and publish
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fixed-name latest aliases
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "dist/YoutubeDiscordPanel Setup $v.exe" "dist/YoutubeDiscordPanel-Setup-latest.exe"
          Copy-Item "dist/YoutubeDiscordPanel $v.exe" "dist/YoutubeDiscordPanel-latest.exe"
          gh release upload "v$v" "dist/YoutubeDiscordPanel-Setup-latest.exe" "dist/YoutubeDiscordPanel-latest.exe" --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        run: gh release edit "${{ steps.ver.outputs.tag }}" --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
