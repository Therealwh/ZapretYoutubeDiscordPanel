name: Release

on:
  push:
    tags: [ 'v1*' ]
  # Version 2 is the WPF/net48 panel and is built by release-wpf.yml. This
  # workflow stays on v1 tags: a v2 tag must not trigger an Electron build that
  # would publish a 100 MB app nobody wants any more.

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version tag
        id: ver
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            # A tag build MUST match package.json — otherwise the tag and the
            # binaries would disagree about which version they are.
            if [ "$tag" != "v$pkg" ]; then
              echo "::error::Tag $tag does not match package.json version $pkg"
              exit 1
            fi
          else
            tag="v$pkg"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        if: steps.ver.outputs.skip != 'true'
        run: npm test

      - name: Create draft release with notes
        if: steps.ver.outputs.skip != 'true'
        run: gh release create "${{ steps.ver.outputs.tag }}" --target "${{ github.sha }}" --draft --title "${{ steps.ver.outputs.tag }}" --generate-notes --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and publish
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fixed-name latest aliases
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "dist/YoutubeDiscordPanel Setup $v.exe" "dist/YoutubeDiscordPanel-Setup-latest.exe"
          Copy-Item "dist/YoutubeDiscordPanel $v.exe" "dist/YoutubeDiscordPanel-latest.exe"
          gh release upload "v$v" "dist/YoutubeDiscordPanel-Setup-latest.exe" "dist/YoutubeDiscordPanel-latest.exe" --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        run: gh release edit "${{ steps.ver.outputs.tag }}" --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
