name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Create draft release with notes
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fixed-name latest aliases
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "dist/YoutubeDiscordPanel Setup $v.exe" "dist/YoutubeDiscordPanel-Setup-latest.exe"
          Copy-Item "dist/YoutubeDiscordPanel $v.exe" "dist/YoutubeDiscordPanel-latest.exe"
          gh release upload "v$v" "dist/YoutubeDiscordPanel-Setup-latest.exe" "dist/YoutubeDiscordPanel-latest.exe" --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
